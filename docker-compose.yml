version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fernum_postgres
    environment:
      POSTGRES_USER: fernum
      POSTGRES_PASSWORD: fernum_dev
      POSTGRES_DB: fernum_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fernum -d fernum_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fernum_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fernum_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fernum_web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://fernum:fernum_dev@postgres:5432/fernum_db?schema=public
      - REDIS_URL=redis://redis:6379
      - MOCK_QUEUE=false
      - STORAGE_PROVIDER=s3
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=fernum-assets
      - APP_SECRET=fernum_development_secret_key_32_bytes_min!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:

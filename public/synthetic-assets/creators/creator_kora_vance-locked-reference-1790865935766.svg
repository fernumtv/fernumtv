<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1365" width="768" height="1365">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="rimLight" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba16c"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="768" height="1365" fill="url(#bgGrad)"/>
  <rect width="768" height="1365" fill="url(#rimLight)"/>

  <!-- Subtle Bio Lab Geometric Graphic -->
  <circle cx="384" cy="520" r="320" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4"/>
  <polygon points="384,240 626,380 626,660 384,800 142,660 142,380" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.2"/>

  <!-- Shoulders & Clinical Blazer -->
  <path d="M120 1365 C140 1020 220 880 384 880 C548 880 628 1020 648 1365 Z" fill="url(#coatGrad)"/>
  <!-- Lapels -->
  <path d="M384 880 L330 1150 L384 1365 L438 1150 Z" fill="#047857"/>

  <!-- Neck -->
  <rect x="334" y="720" width="100" height="180" rx="30" fill="url(#skinGrad)"/>

  <!-- Head Base -->
  <ellipse cx="384" cy="560" rx="150" ry="190" fill="url(#skinGrad)"/>

  <!-- Hair (Sleek Bun / Styled Dark) -->
  <path d="M220 540 C210 320 320 220 384 220 C448 220 558 320 548 540 C520 400 480 330 384 330 C288 330 248 400 220 540 Z" fill="#1e1b4b"/>
  <circle cx="384" cy="210" r="70" fill="#1e1b4b"/>

  <!-- Eyes (Hazel Intelligent Gaze) -->
  <ellipse cx="320" cy="540" rx="28" ry="16" fill="#ffffff"/>
  <circle cx="320" cy="540" r="12" fill="#047857"/>
  <circle cx="323" cy="537" r="4" fill="#ffffff"/>

  <ellipse cx="448" cy="540" rx="28" ry="16" fill="#ffffff"/>
  <circle cx="448" cy="540" r="12" fill="#047857"/>
  <circle cx="451" cy="537" r="4" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M290 512 Q325 500 355 515" stroke="#1e1b4b" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M413 515 Q443 500 478 512" stroke="#1e1b4b" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M384 530 L378 610 L394 610" stroke="#ea580c" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Lips (Calm Composed Expression) -->
  <path d="M344 670 Q384 690 424 670 Q384 680 344 670" fill="#be123c"/>

  <!-- Badge Watermark: Synthetic Reference -->
  <rect x="224" y="1250" width="320" height="48" rx="24" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="384" y="1281" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="2">
    SYNTHETIC CREATOR: KORA VANCE
  </text>
</svg>

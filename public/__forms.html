<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fernum Netlify Forms Detector</title>
</head>
<body>
  <!-- Netlify Form Detection Stub for Next.js / Static Export -->
  <form name="ad-brief" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="ad-brief" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="brandName" />
    <input type="url" name="websiteUrl" />
    <input type="text" name="productToAdvertise" />
    <textarea name="offer"></textarea>
    <select name="planChosen">
      <option value="Launch ($499/mo)">Launch ($499/mo)</option>
      <option value="Growth ($799/mo)">Growth ($799/mo)</option>
      <option value="Scale ($1,099/mo)">Scale ($1,099/mo)</option>
    </select>
  </form>
</body>
</html>

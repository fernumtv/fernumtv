[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 1. Hostname 301 redirects to canonical https://fernum.online
[[redirects]]
  from = "https://www.fernum.online/*"
  to = "https://fernum.online/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.fernum.online/*"
  to = "https://fernum.online/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://fernum.online/*"
  to = "https://fernum.online/:splat"
  status = 301
  force = true

# Security & Global headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://assets.calendly.com https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' https: blob:; connect-src 'self' https://calendly.com https://*.calendly.com https://plausible.io https://test.dodopayments.com https://app.dodopayments.com https://checkout.dodopayments.com https://*.supabase.co; frame-src 'self' https://calendly.com https://*.calendly.com https://test.dodopayments.com https://app.dodopayments.com https://checkout.dodopayments.com;"
    # TEST MODE noindex header across entire site (toggle in LAUNCH-CHECKLIST.md)
    X-Robots-Tag = "noindex, nofollow"

# Permanent Noindex headers for non-indexable routes
[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/portal"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/portal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/thanks"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/cancelled"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/404"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
